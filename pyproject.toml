[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "briscola-rl"
version = "0.1.0"
description = "Two-player Briscola simulator for reinforcement learning and equilibrium computation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["briscola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
